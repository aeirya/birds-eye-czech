name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate static site
        run: |
          set -Eeuo pipefail
          test -s index.html
          test -s grammar.html
          test -s styles.css
          test -s app.js
          grep -q 'Bird.s-eye Czech' index.html
          grep -q 'Seven cases' grammar.html

      - name: Stage site
        run: |
          set -Eeuo pipefail
          mkdir -p _site
          cp -- index.html grammar.html styles.css app.js .nojekyll LICENSE _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
